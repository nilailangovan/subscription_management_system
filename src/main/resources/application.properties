# ──────────────────────────────────────────────────────────────
# Application: Brightloop Subscription Management System
# ──────────────────────────────────────────────────────────────

spring.application.name=subscription-management-system

# ──────────────────────────────────────────────────────────────
# PostgreSQL Database Configuration
# Change these values to match your local PostgreSQL setup.
# ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/looppay_db
spring.datasource.username=postgres
spring.datasource.password=nila0612!
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────────────────────
# JPA / Hibernate Configuration
# ──────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ──────────────────────────────────────────────────────────────
# JWT Configuration
# ──────────────────────────────────────────────────────────────
app.jwt.secret=bG9vcHBheS1zdWJzY3JpcHRpb24tbWFuYWdlbWVudC1zeXN0ZW0tc2VjcmV0LWtleS0yMDI0
# Token expiry: 24 hours in milliseconds (24 * 60 * 60 * 1000)
app.jwt.expiration-ms=86400000
# Password reset token expiry: 1 hour in milliseconds
app.jwt.reset-token-expiry-ms=3600000

# ──────────────────────────────────────────────────────────────
# Mail Configuration (Mailtrap for development/testing)
# Real values come from environment variables so SMTP secrets never live in this file.
# ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:your_mailtrap_username}
spring.mail.password=${MAIL_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# true = print reset links to the backend console instead of sending emails.
# Set MAIL_USE_CONSOLE=false (plus the MAIL_* values above) to send real emails.
app.mail.use-console=${MAIL_USE_CONSOLE:true}
app.mail.from=${MAIL_FROM:no-reply@looppay.com}

# The base URL to build password-reset links (where the frontend runs)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ──────────────────────────────────────────────────────────────
# Server Configuration
# ──────────────────────────────────────────────────────────────
server.port=8080

# ──────────────────────────────────────────────────────────────
# Admin Seed Configuration
# ──────────────────────────────────────────────────────────────
app.admin.email=admin@looppay.com
app.admin.password=Admin@1234
app.admin.first-name=Super
app.admin.last-name=Admin

